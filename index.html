<!DOCTYPE html>
<html lang="zh-CN">

  .wrap { max-width: 800px; margin: 0 auto; background: #fff; min-height: 100vh; }

  footer a { display: inline-block; padding: 10px 36px; background: #07c160; color: #fff; text-decoration: none; border-radius: 8px; font-size: 15px; }
  footer .tip { margin-top: 12px; font-size: 12px; color: #bbb; }

<body>
<div class="wrap">
